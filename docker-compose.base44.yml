# Base44 dev environment — CommHQ (NestJS + MongoDB + React/Vite)
# Brings up MongoDB, the NestJS backend (live-reload), and the Vite frontend.
# Frontend is exposed on host port 3000; backend API on host port 8000.

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./Backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/commhq
      - CORS_ORIGIN=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - FRONTEND_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - AI_PROVIDER=mock
      - SEED_DEMO=true
      - JWT_EXPIRES_IN=1d
      - JWT_REFRESH_EXPIRES_IN=7d
      - INVITATION_TTL_HOURS=72
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8000:3000"
    command: sh -c "npm install && npm run start:dev"

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=https://8000-${BASE44_PUBLIC_HOST_SUFFIX}
      - VITE_WS_URL=https://8000-${BASE44_PUBLIC_HOST_SUFFIX}
      - VITE_USE_MOCKS=false
      # Vite >= 6.1 appends this to allowedHosts automatically.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    depends_on:
      - backend
    ports:
      - "3000:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  mongo_data:
  backend_node_modules:

  frontend_node_modules:
